# dsh-llm-api-pool bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-llm-api-pool
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-llm-api-pool` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like a manual cordis.patch.yml mount line. No profile
# file edits needed — one command installs and mounts both halves.
#
# If the profile still carries an old manual mount line for this plugin in its
# own cordis.patch.yml, remove it before switching to the bundle channel to
# avoid double-mounting.
- insert:
    - id: llm-api-pool
      name: 'dsh-llm-api-pool'